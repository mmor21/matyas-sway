## Matyas Sway — personal overrides
##
## Everything in this file overrides the base config above.
## Personal preferences go here; the base config is not modified.
##
## This file is loaded LAST (see the include at the end of sway/config),
## so anything here wins over the base bindings.

##── Fullscreen and single-window view ────────────────
## $mod+f is repurposed for the single-window toggle (see below).
## True fullscreen (covers the bar) moves to $mod+Shift+f.

bindsym $mod+Shift+f fullscreen toggle

## Trial: single-window view via layout stacking.
## Comment this and uncomment the tabbed line to test the other variant.

bindsym $mod+f layout toggle stacking split
#bindsym $mod+f layout toggle tabbed split

##── Theme menu ────────────────────────────────────────
## Opens a rofi menu with three options:
##   Default (base16-ocean), Light, Pywal
## Dispatch handled by scripts/rofi_theme.

bindsym $mod+Ctrl+t exec ~/.config/sway/scripts/rofi_theme

# -- Terminal --
set $ghostty ghostty
bindsym $mod+Return          exec $ghostty
# -- Launcher --
bindsym $alt+Space           exec $rofi_launcher

# -- Cursor --
seat seat0 xcursor_theme Bibata-Material-Pink-Rose 28

